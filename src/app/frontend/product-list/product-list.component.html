<div id="product-details" [class.product-details-active]="isDetailsOpened">
  <div class="product-details-cont" [class.active]="isDetailsOpened" >
    <div class="product-details-close" (click)="details()">
      <img src="./../../../assets/icons/close-white.svg" alt="">
    </div>
    <ng-container *ngIf="productDetialList">
    <div class="product-details-info">
      <div class="product-details-img-cont">
        <img [src]="productDetialList.imagePath" alt="">
      </div>
      <div class="product-heading mt-4">{{productDetialList.name}}</div>
      <!--<div class="d-flex flex-row justify-content-between align-items-end">
         <div class="d-flex flex-column ">
          <div class="product-price">Price</div>
          <div class="product-price-value">₹ {{productDetialList.price}}</div>
        </div>
      </div>-->
      <div class="pt-3 product-descr">{{productDetialList.descr}}</div>
      <div class="pt-3 buy-heading" *ngIf="(productDetialList.amazonLink !== 'null' && productDetialList.amazonLink !== null && productDetialList.amazonLink !== '')||(productDetialList.flipkartLink !== 'null' && productDetialList.flipkartLink !== null && productDetialList.flipkartLink !== '')">Buy the product on:</div>
      <div class="d-flex pt-3" >
        <div *ngIf="productDetialList.amazonLink !== 'null' && productDetialList.amazonLink !== null && productDetialList.amazonLink !== ''">
          <a class="mr-3 btn btn-online amazon" [attr.href]="productDetialList.amazonLink" target="_blank">
            <img height="25px" src="./../../../assets/icons/Amazon_logo.svg" alt="">
          </a>

        </div>
        <div *ngIf="productDetialList.flipkartLink !== 'null' && productDetialList.flipkartLink !== null && productDetialList.flipkartLink !== ''">
          <a class=" btn btn-online flipkart" [attr.href]="productDetialList.flipkartLink" target="_blank">
            <img height="25px" src="./../../../assets/icons/flipkart.svg" alt="">
          </a>
        </div>
      </div>
    </div>
  </ng-container>
  </div>
  <div class="product-details-overlay" [class.active]="isDetailsOpened" (click)="details()"></div>
</div>
