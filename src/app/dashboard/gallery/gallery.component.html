<app-dashboard-nav></app-dashboard-nav>

<div id="gallery">
  <div class="container pt-5">
    <div class="mb-3 section-heading sec-head-dash">Gallery</div>
  </div>
  <div class="container pb-5">
    <div class="gallery-cont row">
      <div class="col-md-6 mb-4">
        <div class="image-upload overflow-hidden"  (click)="openModal(template); newFile()">
          <div class="d-flex align-items-center justify-content-center h-100">
            <img width="200px" src="./../../../assets/images/dashboard/image.png" alt=""></div>
          </div>
          </div>
      <div class="col-md-6 mb-4" *ngFor="let img of gallery">
        <div class="image-cont overflow-hidden position-relative">
          <div class="edit-product" (click)="openModal(template); uploadFile(img)">
            <img src="./../../../assets/images/dashboard/edit.png" alt="">
          </div>
          <img width="100%" [src]="img.imagePath" alt="">
        </div>
      </div>
      <!-- <div class="col-md-6">
        <div class="image-cont">
          <img width="100%" src="./../../../assets/images/c1.JPG" alt="">
        </div>
      </div> -->

    </div>
  </div>
</div>

<ng-template #template>
  <div class="modal-header">
    <h4 class="modal-title pull-left">
      <ng-container *ngIf="isNewImage">Uplaod new image</ng-container>
      <ng-container *ngIf="!isNewImage">Delete the image</ng-container>
      </h4>
    <button type="button" class="close pull-right" aria-label="Close" (click)="modalRef.hide()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <ng-container *ngIf="isNewImage">
    <div class="alert alert-warning mx-3 mb-3" role="alert">
      <svg class="bi flex-shrink-0 me-2 mr-2" width="24" height="24" role="img" aria-label="Warning:">
        <use xlink:href="#exclamation-triangle-fill" />
      </svg>
      Image must be 2400*1100 resolution & less than 400kb.
    </div>
    <div class="image-previewer">
      <div class="d-flex justify-content-center align-items-center image-preview-cont"
        (click)="fileupload.click()">
        <img height="100%" [src]="imagePreview"
          *ngIf="imagePreview !== '' && imagePreview" alt="">
        <img *ngIf="imagePreview === '' || !imagePreview"
          src="./../../../assets/images/dashboard/image.png" alt="">
      </div>

    </div>
    <div class="d-flex justify-content-between px-3" >
      <div>
        <button type="button" class="btn btn-outline-success my-3" (click)="fileupload.click()">Select file</button>
        <input type="file" #fileupload (change)="onImagePicked($event)">
        <!-- <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="4 / 3"
            format="png"
            (imageCropped)="imageCropped($event)"
            (imageLoaded)="imageLoaded()"
            (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()"
        ></image-cropper>

          <img [src]="croppedImage" /> -->
      </div>
      <div>
          <button class="btn btn-success my-3" [disabled]='!enableUpload' (click)="addGallery()">Upload</button>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="!isNewImage">
    <div class="image-previewer h-100">
      <div class="d-flex justify-content-center align-items-center image-preview-cont h-100">
        <img height="100%" [src]="imagePreview"
          *ngIf="imagePreview !== '' && imagePreview" alt="">
        <img *ngIf="imagePreview === '' || !imagePreview"
          src="./../../../assets/images/dashboard/image.png" alt="">
      </div>
    </div>
    <div class="d-flex justify-content-end px-4" >
      <div>
          <button class="btn btn-danger my-3" (click)="deleteGallery()">Delete</button>
      </div>
    </div>
  </ng-container>
  </div>
</ng-template>

<div class="alert-cont">
    <alert [isOpen]="openAlert" [type]="alerts.type" [dismissOnTimeout]="alertsTimeout"><span class="mx-3">{{ alerts.msg }}</span><img height="40px" src="./../../../assets/icons/white_tick.svg"></alert>
</div>
